# Porta do gateway
server.port=${SERVER_PORT}

# Nome da aplicação
spring.application.name=${SPRING_APPLICATION_NAME}

# ========================
# ROUTES - AUTH SERVICE
# ========================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# ========================
# ROUTES - PATIENT SERVICE
# ========================
spring.cloud.gateway.routes[1].id=patient-service
spring.cloud.gateway.routes[1].uri=${PATIENT_SERVICE_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/patients,/patients/**

# ========================
# ROUTES - DOCTOR SERVICE
# ========================
spring.cloud.gateway.routes[2].id=doctor-service
spring.cloud.gateway.routes[2].uri=${DOCTOR_SERVICE_URL}
spring.cloud.gateway.routes[2].predicates[0]=Path=/doctor,/doctor/**

# ========================
# ROUTES - SCREENING SERVICE
# ========================
spring.cloud.gateway.routes[3].id=screening-service
spring.cloud.gateway.routes[3].uri=${SCREENING_SERVICE_URL}
spring.cloud.gateway.routes[3].predicates[0]=Path=/screenings,/screenings/**

# ========================
# ROUTES - MEDICAL RECORDS SERVICE
# ========================
spring.cloud.gateway.routes[4].id=medical-records-service
spring.cloud.gateway.routes[4].uri=${MEDICAL_RECORDS_SERVICE_URL}
spring.cloud.gateway.routes[4].predicates[0]=Path=/medical-records,/medical-records/**

# ========================
# LOGS
# ========================
logging.level.org.springframework.cloud.gateway=${GATEWAY_LOG_LEVEL}

# ========================
# SECURITY
# ========================
jwt.secret=${JWT_SECRET}
