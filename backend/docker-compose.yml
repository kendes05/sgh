services:
  user-postgres:
    image: postgres:15
    container_name: healthsys-user-postgres
    env_file:
      - ./user-service/.env
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    container_name: healthsys-user-service
    env_file:
      - ./user-service/.env
    ports:
      - "8080:8080"
    depends_on:
      user-postgres:
        condition: service_healthy

  patient-postgres:
    image: postgres:15
    container_name: healthsys-patient-postgres
    env_file:
      - ./patient-service/.env
    ports:
      - "5434:5432"
    volumes:
      - patient_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-service:
    build: ./patient-service
    container_name: healthsys-patient-service
    env_file:
      - ./patient-service/.env
    ports:
      - "8081:8080"
    depends_on:
      patient-postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: healthsys-api-gateway
    env_file:
      - ./api-gateway/.env
    ports:
      - "8082:8082"
    depends_on:
      - user-service
      - patient-service


volumes:
  user_postgres_data:
  patient_postgres_data:
