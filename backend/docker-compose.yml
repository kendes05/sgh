services:
  user-postgres:
    image: postgres:15
    container_name: healthsys-user-postgres
    env_file:
      - ./user-service/.env
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    container_name: healthsys-user-service
    env_file:
      - ./user-service/.env
    ports:
      - "8080:8080"
    depends_on:
      user-postgres:
        condition: service_healthy

  patient-postgres:
    image: postgres:15
    container_name: healthsys-patient-postgres
    env_file:
      - ./patient-service/.env
    ports:
      - "5434:5432"
    volumes:
      - patient_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-service:
    build: ./patient-service
    container_name: healthsys-patient-service
    env_file:
      - ./patient-service/.env
    ports:
      - "8081:8080"
    depends_on:
      patient-postgres:
        condition: service_healthy

  doctor-postgres:
    image: postgres:15
    container_name: healthsys-doctor-postgres
    env_file:
      - ./doctor-service/.env
    ports:
      - "5435:5432"
    volumes:
      - doctor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  doctor-service:
    build: ./doctor-service
    container_name: healthsys-doctor-service
    env_file:
      - ./doctor-service/.env
    ports:
      - "8083:8080"
    depends_on:
      doctor-postgres:
        condition: service_healthy

  screening-postgres:
    image: postgres:15
    container_name: healthsys-screening-postgres
    env_file:
      - ./screening-service/.env
    ports:
      - "5436:5432"
    volumes:
      - screening_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  screening-service:
    build: ./screening-service
    container_name: healthsys-screening-service
    env_file:
      - ./screening-service/.env
    ports:
      - "8084:8080"
    depends_on:
      screening-postgres:
        condition: service_healthy

  medical-records-mongo:
    image: mongo:7
    container_name: healthsys-medical-records-mongo
    ports:
      - "27017:27017"
    volumes:
      - medical_records_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  medical-records-service:
    build: ./medical-records-service
    container_name: healthsys-medical-records-service
    env_file:
      - ./medical-records-service/.env
    ports:
      - "8085:8080"
    depends_on:
      medical-records-mongo:
        condition: service_healthy


  api-gateway:
    build: ./api-gateway
    container_name: healthsys-api-gateway
    env_file:
      - ./api-gateway/.env
    ports:
      - "8082:8082"
    depends_on:
      - user-service
      - patient-service
      - doctor-service
      - screening-service
      - medical-records-service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
  
volumes:
  user_postgres_data:
  patient_postgres_data:
  doctor_postgres_data:
  screening_postgres_data:
  medical_records_mongo_data:
