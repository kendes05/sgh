spring.application.name=medical-records-service
server.port=${SERVER_PORT:8085}

# MONGODB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medical_records_db}
spring.data.mongodb.auto-index-creation=true

# CLIENTS
PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:http://localhost:8081}
DOCTOR_SERVICE_URL=${DOCTOR_SERVICE_URL:http://localhost:8083}

# EUREKA (desativado)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
