spring.application.name=screening-service
server.port=${SERVER_PORT:8080}

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.screening-created=${TOPIC_SCREENING_CREATED:triagem.criada}
app.kafka.topics.screening-classified=${TOPIC_SCREENING_CLASSIFIED:triagem.classificada}
app.kafka.topics.screening-critical=${TOPIC_SCREENING_CRITICAL:triagem.critica}

# FEIGN CLIENTS
PATIENT_SERVICE_URL=${PATIENT_SERVICE_URL:http://localhost:8081}

# EUREKA
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
