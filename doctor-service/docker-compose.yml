version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build: ./backend/user-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hospital_db
      DB_USER: postgres
      DB_PASSWORD: 12345678
      JWT_SECRET: healthsys-chave-super-secreta-projeto-distribuido-2026
    depends_on:
      - postgres

  doctor-service:
    build: ./backend/doctor-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hospital_db
      DB_USER: postgres
      DB_PASSWORD: 12345678
      JWT_SECRET: healthsys-chave-super-secreta-projeto-distribuido-2026   # MESMO segredo do user-service!
    depends_on:
      - postgres

volumes:
  postgres_data:
